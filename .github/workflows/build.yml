name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: ./tools/setup-deps.sh
      - name: Build
        run: |
          idf.py set-target esp32s3
          idf.py build
      - name: Ed25519 constant-time gate
        run: ./tools/check-eddsa-ct.sh
