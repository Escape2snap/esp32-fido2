name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    defaults:
      run:
        # The IDF image does not put idf.py on PATH until export.sh is sourced.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: ./tools/setup-deps.sh
      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Ed25519 constant-time gate
        run: |
          . "$IDF_PATH/export.sh"
          ./tools/check-eddsa-ct.sh
